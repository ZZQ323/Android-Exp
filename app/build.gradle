plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.example.myapplication1'
    compileSdk {
        version = release(37)
    }

    defaultConfig {
        applicationId "com.example.myapplication1"
        minSdk 24
        targetSdk 37
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            optimization {
                enable false
            }
        }
    }
    androidResources {
        // TFLite 模型文件不能被 aapt 压缩，否则运行时 mmap 会失败
        noCompress += "tflite"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation libs.activity.ktx
    implementation libs.appcompat
    implementation libs.constraintlayout
    implementation libs.material
    implementation libs.tensorflow.lite
    implementation(libs.tensorflow.lite.support) {
        // tensorflow-lite-support 和它传递依赖的 tensorflow-lite-support-api 用了同一个
        // manifest namespace（org.tensorflow.lite.support），新版 AGP 要求 namespace 唯一，
        // 两者同时出现在依赖图里会导致 manifest merge 失败。我们只用基础包里的
        // TensorImage/TensorBuffer/ResizeOp/NormalizeOp/FileUtil 等类，用不到
        // -api 那个给 task-library 系列用的子模块，排除掉即可。
        exclude group: "org.tensorflow", module: "tensorflow-lite-support-api"
    }
    implementation libs.exifinterface
    testImplementation libs.junit
    androidTestImplementation libs.espresso.core
    androidTestImplementation libs.ext.junit
}