plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.example.myapplication1'
    compileSdk {
        version = release(37)
    }

    defaultConfig {
        applicationId "com.example.myapplication1"
        minSdk 24
        targetSdk 37
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            optimization {
                enable false
            }
        }
    }
    androidResources {
        // TFLite 模型文件不能被 aapt 压缩，否则运行时 mmap 会失败
        noCompress += "tflite"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation libs.activity.ktx
    implementation libs.appcompat
    implementation libs.constraintlayout
    implementation libs.litert.support.api
    implementation libs.material
    // 只用最基础的 LiteRT Interpreter（前身是 org.tensorflow:tensorflow-lite）。
    // 不用 *-support 辅助库：它的 "-support" 和 "-support-api" 两个 aar 共用同一个
    // manifest namespace，新版 AGP 要求 namespace 唯一，这个问题在改名叫 LiteRT
    // 之后依然存在，所以图片缩放/归一化改成在 PetClassifier 里手写。
    implementation libs.litert
    implementation libs.exifinterface
    testImplementation libs.junit
    androidTestImplementation libs.espresso.core
    androidTestImplementation libs.ext.junit
}